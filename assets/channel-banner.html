<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Bilibili 个人空间头图 - DailyPaper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1280px;
      height: 200px;
      overflow: hidden;
      background: #090d16;
      background-image:
        radial-gradient(circle at 10% 40%, rgba(37, 99, 235, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 90% 60%, rgba(16, 185, 129, 0.2) 0%, transparent 45%),
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 60px;
      position: relative;
    }

    .brand-section {
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-left: 100px;
      z-index: 5;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }
    .brand-logo-badge {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }
    .channel-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .channel-slogan {
      font-size: 16px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }
    .slogan-highlight {
      color: #38bdf8;
      font-weight: 700;
    }

    .disciplines-section {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      z-index: 5;
    }
    .frequency-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 999px;
    }
    .tags-row {
      display: flex;
      gap: 10px;
    }
    .discipline-tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .discipline-tag.current {
      background: rgba(59, 130, 246, 0.2);
      border-color: #3b82f6;
      color: #60a5fa;
    }

    .bg-tech-line {
      position: absolute;
      right: 20px;
      top: -40px;
      width: 320px;
      height: 320px;
      border: 1px dashed rgba(56, 189, 248, 0.15);
      border-radius: 50%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="brand-section">
    <div class="brand-row">
      <div class="brand-logo-badge">DP</div>
      <div class="channel-title">DailyPaper · 每日论文</div>
    </div>
    <div class="channel-slogan">
      精选热门前沿论文 · <span class="slogan-highlight">几分钟看懂一篇</span>
    </div>
  </div>

  <div class="disciplines-section">
    <div class="frequency-badge">⚡ 每周 3 期 · 跟踪 Hugging Face 论文日榜</div>
    <div class="tags-row">
      <div class="discipline-tag current">AI / 人工智能</div>
      <div class="discipline-tag">经济</div>
      <div class="discipline-tag">材料</div>
      <div class="discipline-tag">化学</div>
      <div class="discipline-tag">数学</div>
      <div class="discipline-tag">物理</div>
    </div>
  </div>

  <div class="bg-tech-line"></div>
</body>
</html>
