<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 460" width="1650" height="460" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <!-- 第 7 页示意图：只概括方法，不是实验结果（Claude 按 materials.md 绘制，2026-10-07） -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- 输入条件 -->
  <rect x="20" y="165" width="250" height="130" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="145" y="223" text-anchor="middle" font-size="32" font-weight="700" fill="#f1f5f9">文字或图片</text>
  <text x="145" y="265" text-anchor="middle" font-size="28" fill="#94a3b8">条件</text>
  <path d="M270 205 C 335 205, 335 110, 396 110" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M270 255 C 335 255, 335 350, 396 350" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 两条流 -->
  <rect x="400" y="50" width="340" height="120" rx="16" fill="rgba(59, 130, 246, 0.16)" stroke="#3b82f6" stroke-width="3"/>
  <text x="570" y="122" text-anchor="middle" font-size="36" font-weight="800" fill="#f1f5f9">视频流</text>
  <rect x="400" y="290" width="340" height="120" rx="16" fill="rgba(16, 185, 129, 0.16)" stroke="#10b981" stroke-width="3"/>
  <text x="570" y="362" text-anchor="middle" font-size="36" font-weight="800" fill="#f1f5f9">音频流</text>

  <!-- 两条流之间双向交换信息 -->
  <line x1="570" y1="180" x2="570" y2="280" stroke="#f59e0b" stroke-width="4" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
  <text x="596" y="240" font-size="28" font-weight="700" fill="#fbbf24">双向交换信息</text>

  <!-- 共同输出 -->
  <path d="M740 110 C 830 110, 830 200, 896 200" fill="none" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M740 350 C 830 350, 830 260, 896 260" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="900" y="155" width="300" height="150" rx="16" fill="#1e293b" stroke="#e2e8f0" stroke-width="2.5"/>
  <text x="1050" y="222" text-anchor="middle" font-size="36" font-weight="800" fill="#f1f5f9">五秒音画</text>
  <text x="1050" y="268" text-anchor="middle" font-size="26" fill="#94a3b8">画面为原生 SD</text>

  <!-- 可选的后处理：只把画面放大到 FullHD，声音不经过这一步 -->
  <path d="M1200 230 L1296 230" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-amber)"/>
  <text x="1248" y="212" text-anchor="middle" font-size="24" fill="#fbbf24">仅画面</text>
  <rect x="1300" y="180" width="160" height="100" rx="14" fill="rgba(245, 158, 11, 0.10)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="1380" y="241" text-anchor="middle" font-size="30" font-weight="700" fill="#f1f5f9">超分辨率</text>
  <path d="M1460 230 L1496 230" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-amber)"/>
  <rect x="1500" y="180" width="140" height="100" rx="14" fill="rgba(245, 158, 11, 0.10)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="1570" y="241" text-anchor="middle" font-size="30" font-weight="700" fill="#f1f5f9">FullHD</text>
</svg>
