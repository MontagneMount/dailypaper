<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="460" viewBox="0 0 1650 460">
  <!-- 第三期第 4 页：三种任务。依据 HateClipSeg 第 3.1～3.3 节的任务定义自己画，不用 Figure 3 的视频帧；
       颜色只区分任务，不表示优劣；色块的长短只是示意，不是实验数据。画法见 templates/README.md「示意图怎么画」 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <text id="note" class="muted" x="16" y="30" font-size="22">任务示意，非真实样本</text>

  <g id="trimmed" class="tone-accent" text-anchor="middle">
    <rect class="line" x="15" y="48" width="520" height="404" rx="18" stroke-width="2"/>
    <text class="label" x="275" y="98" font-size="28" font-weight="700">第一种：已切片段分类</text>
    <text class="muted" x="275" y="152" font-size="22">边界已知</text>
    <path class="line" d="M125 166 V274 M425 166 V274" stroke-width="3"/>
    <rect class="box solid" x="125" y="185" width="300" height="70" rx="10"/>
    <text class="on-solid" x="275" y="230" font-size="28" font-weight="700">已切好的片段</text>
    <path class="line" d="M275 262 V350" stroke-width="4" marker-end="url(#arrow)"/>
    <rect class="box" x="105" y="360" width="340" height="72" rx="14" stroke-width="2.5"/>
    <text class="strong" x="275" y="406" font-size="28" font-weight="700">判断标签</text>
  </g>

  <g id="localize" class="tone-highlight" text-anchor="middle">
    <rect class="line" x="565" y="48" width="520" height="404" rx="18" stroke-width="2"/>
    <text class="label" x="825" y="98" font-size="28" font-weight="700">第二种：时序定位</text>
    <text class="soft" x="825" y="152" font-size="24">输入：完整视频</text>
    <rect class="box" x="595" y="172" width="460" height="56" rx="10" stroke-width="2.5"/>
    <rect class="box solid" x="750" y="172" width="150" height="56"/>
    <path class="line" d="M750 162 V246 M900 162 V246" stroke-width="3"/>
    <text class="soft" x="750" y="276" font-size="22">预测起点</text>
    <text class="soft" x="900" y="276" font-size="22">预测终点</text>
    <path class="line" d="M825 238 V350" stroke-width="4" marker-end="url(#arrow)"/>
    <rect class="box" x="655" y="360" width="340" height="72" rx="14" stroke-width="2.5"/>
    <text class="strong" x="825" y="406" font-size="28" font-weight="700">标签 + 起止时间</text>
  </g>

  <g id="online" class="tone-special" text-anchor="middle">
    <rect class="line" x="1115" y="48" width="520" height="404" rx="18" stroke-width="2"/>
    <text class="label" x="1375" y="98" font-size="28" font-weight="700">第三种：在线分类</text>
    <rect class="box" x="1145" y="186" width="230" height="56" rx="10" stroke-width="2.5"/>
    <text class="label" x="1260" y="223" font-size="26" font-weight="700">过去</text>
    <g class="tone-neutral">
      <rect class="box" x="1375" y="186" width="230" height="56" rx="10" stroke-width="2.5"/>
      <text class="muted" x="1490" y="222" font-size="24">未来：不可使用</text>
    </g>
    <text class="label" x="1375" y="152" font-size="26" font-weight="700">当前</text>
    <path class="line" d="M1375 164 V264" stroke-width="5"/>
    <path class="line" d="M1375 272 V350" stroke-width="4" marker-end="url(#arrow)"/>
    <rect class="box" x="1205" y="360" width="340" height="72" rx="14" stroke-width="2.5"/>
    <text class="strong" x="1375" y="406" font-size="28" font-weight="700">判断当前时刻</text>
  </g>
</svg>
