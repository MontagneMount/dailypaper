<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
  <!-- 示例期第 6 页的示意图（虚构）。颜色和字体用类名，跟着风格走；部件分组并带 id，以后镜头表可以逐个出现。
       画法见 templates/README.md「示意图怎么画」 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <g id="step1" class="tone-accent" text-anchor="middle">
    <rect class="box" x="40" y="80" width="340" height="220" rx="20" stroke-width="3"/>
    <text class="label" x="210" y="140" font-size="26" font-weight="700">第 1 步</text>
    <text class="strong" x="210" y="208" font-size="48" font-weight="700">切块</text>
    <text class="soft" x="210" y="260" font-size="26">分成固定大小的块</text>
  </g>

  <path id="arrow1" class="line tone-neutral" d="M392 190 H516" stroke-width="5" marker-end="url(#arrow)"/>

  <g id="step2" class="tone-accent" text-anchor="middle">
    <rect class="box" x="530" y="80" width="340" height="220" rx="20" stroke-width="3"/>
    <text class="label" x="700" y="140" font-size="26" font-weight="700">第 2 步</text>
    <text class="strong" x="700" y="208" font-size="48" font-weight="700">计算</text>
    <text class="soft" x="700" y="260" font-size="26">每块单独算注意力</text>
  </g>

  <path id="arrow2" class="line tone-neutral" d="M882 190 H1006" stroke-width="5" marker-end="url(#arrow)"/>

  <g id="step3" class="tone-positive" text-anchor="middle">
    <rect class="box" x="1020" y="80" width="340" height="220" rx="20" stroke-width="3"/>
    <text class="label" x="1190" y="140" font-size="26" font-weight="700">第 3 步</text>
    <text class="strong" x="1190" y="208" font-size="48" font-weight="700">合并</text>
    <text class="soft" x="1190" y="260" font-size="26">拼成完整输出</text>
  </g>

  <text id="note" class="muted" x="700" y="380" font-size="22" text-anchor="middle">示例示意图（虚构）</text>
</svg>
