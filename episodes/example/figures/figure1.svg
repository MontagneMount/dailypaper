<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <!-- Placeholder figure for the demo episode (fictional) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="40" y="52" font-size="28" fill="#0f172a">Figure 1 · 示例架构图（虚构）</text>

  <rect x="40" y="90" width="1120" height="60" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="600" y="130" font-size="26" text-anchor="middle" fill="#0f172a">输入：长序列</text>

  <g font-size="26" text-anchor="middle" fill="#0f172a">
    <rect x="40" y="200" width="320" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="200" y="250">块 1</text>
    <rect x="440" y="200" width="320" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="600" y="250">块 2</text>
    <rect x="840" y="200" width="320" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="1000" y="250">块 3</text>

    <rect x="40" y="330" width="320" height="70" rx="8" fill="#dcfce7" stroke="#22c55e"/>
    <text x="200" y="374">注意力</text>
    <rect x="440" y="330" width="320" height="70" rx="8" fill="#dcfce7" stroke="#22c55e"/>
    <text x="600" y="374">注意力</text>
    <rect x="840" y="330" width="320" height="70" rx="8" fill="#dcfce7" stroke="#22c55e"/>
    <text x="1000" y="374">注意力</text>

    <rect x="720" y="470" width="380" height="170" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="910" y="548">Merge</text>
    <text x="910" y="588" font-size="22">合并模块</text>

    <rect x="100" y="520" width="400" height="80" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="300" y="570">输出</text>
  </g>

  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="200" y1="150" x2="200" y2="196"/>
    <line x1="600" y1="150" x2="600" y2="196"/>
    <line x1="1000" y1="150" x2="1000" y2="196"/>
    <line x1="200" y1="280" x2="200" y2="326"/>
    <line x1="600" y1="280" x2="600" y2="326"/>
    <line x1="1000" y1="280" x2="1000" y2="326"/>
    <line x1="200" y1="400" x2="760" y2="466"/>
    <line x1="600" y1="400" x2="860" y2="466"/>
    <line x1="1000" y1="400" x2="980" y2="466"/>
    <line x1="720" y1="560" x2="504" y2="560"/>
  </g>
</svg>
