<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>DailyPaper - 自制概念示意图</title>
  <link rel="stylesheet" href="themes/academic.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--page-bg);
      background-image: 
        radial-gradient(circle at 50% 15%, color-mix(in srgb, var(--special) calc(15% * var(--glow)), transparent) 0%, transparent 50%),
        linear-gradient(color-mix(in srgb, var(--ink) calc(2% * var(--grid)), transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--ink) calc(2% * var(--grid)), transparent) 1px, transparent 1px);
      background-size: 100% 100%, 48px 48px, 48px 48px;
      font-family: var(--font-body);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .header-bar {
      height: 80px;
      padding: 0 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .badge-concept {
      background: color-mix(in srgb, var(--special) 20%, var(--tint-base));
      border: 1px solid color-mix(in srgb, var(--special) 50%, var(--tint-base));
      color: var(--special-text);
      font-size: 16px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
    }
    .section-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-title);
      font-family: var(--font-heading);
    }
    .page-index {
      font-size: 18px;
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-weight: 600;
    }

    /* 主内容区 (高 838px) */
    .main-area {
      height: 838px;
      padding: 24px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .page-heading {
      font-size: 38px;
      font-weight: 900;
      color: var(--text-strong);
      margin-bottom: 20px;
      text-align: center;
      font-family: var(--font-heading);
    }

    /* 示意图主体画板 */
    .diagram-board {
      width: 1760px;
      height: 520px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 40px color-mix(in srgb, var(--shadow-color) calc(40% * var(--shadow-strength)), transparent);
      margin-bottom: 24px;
    }
    
    /* 规范要求的强制性「示意图」显著水印标识 */
    .schematic-watermark {
      position: absolute;
      top: 18px;
      right: 24px;
      background: color-mix(in srgb, var(--highlight) 15%, var(--tint-base));
      border: 1.5px solid var(--highlight);
      color: var(--highlight-text);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 6px 16px;
      border-radius: 6px;
      z-index: 10;
      box-shadow: 0 4px 12px color-mix(in srgb, var(--highlight) calc(20% * var(--glow)), transparent);
    }

    .diagram-graphic {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .diagram-graphic img {
      max-width: 96%;
      max-height: 96%;
      object-fit: contain;
    }

    /* SVG 示意图：脚本把 <img> 换成嵌在页面里的 SVG，颜色和字体跟着风格走。
       类名的用法见 templates/README.md「示意图怎么画」；写死颜色的旧示意图照原样显示。 */
    .diagram-svg {
      font-family: var(--font-body);
      font-weight: 400;
      letter-spacing: normal;
      line-height: normal;
      fill: var(--text);
    }
    .diagram-svg svg { display: block; }
    .diagram-svg svg, .diagram-svg .tone-neutral { --tone: var(--text-muted); --tone-text: var(--text-soft); }
    .diagram-svg .tone-accent { --tone: var(--accent); --tone-text: var(--accent-text); }
    .diagram-svg .tone-positive { --tone: var(--positive); --tone-text: var(--positive-text); }
    .diagram-svg .tone-negative { --tone: var(--negative); --tone-text: var(--negative-text); }
    .diagram-svg .tone-highlight { --tone: var(--highlight); --tone-text: var(--highlight-text); }
    .diagram-svg .tone-special { --tone: var(--special); --tone-text: var(--special-text); }
    .diagram-svg .box { fill: color-mix(in srgb, var(--tone) 10%, var(--tint-base)); stroke: var(--tone); }
    .diagram-svg .box.solid { fill: var(--tone); }
    .diagram-svg .line { fill: none; stroke: var(--tone); }
    .diagram-svg .label { fill: var(--tone-text); }
    .diagram-svg .strong { fill: var(--text-strong); }
    .diagram-svg .soft { fill: var(--text-soft); }
    .diagram-svg .muted { fill: var(--text-muted); }
    .diagram-svg .on-solid { fill: var(--on-accent); }

    /* 下方三栏核心推演提炼 */
    .takeaway-grid {
      width: 1760px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .takeaway-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .step-num {
      width: 32px;
      height: 32px;
      background: var(--special);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      color: var(--on-accent);
      flex-shrink: 0;
    }
    .takeaway-body {
      font-size: 17px;
      line-height: 1.45;
      color: var(--text-soft);
    }
    .takeaway-strong {
      color: var(--text-strong);
      font-weight: 700;
    }

    /* 底部 15% 字幕安全保留区 (高 162px) */
    .subtitle-safe-area {
      height: 162px;
      width: 100%;
      border-top: 1px dashed color-mix(in srgb, var(--ink) 12%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--subtitle-band);
    }
    .subtitle-placeholder-tip {
      font-size: 14px;
      color: color-mix(in srgb, var(--ink) 25%, transparent);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="header-left">
      <span class="badge-concept">原理解析示意</span>
      <h2 class="section-title">{{page_topic}}</h2>
    </div>
    <div class="page-index">{{page_number}} / {{total_pages}}</div>
  </div>

  <div class="main-area">
    <h1 class="page-heading">{{diagram_title}}</h1>

    <div class="diagram-board">
      <div class="schematic-watermark">自制原理 · 示意图</div>
      <div class="diagram-graphic">
        <img src="{{diagram_image_path}}" alt="概念示意图">
      </div>
    </div>

    <div class="takeaway-grid">
      <div class="takeaway-card">
        <div class="step-num">1</div>
        <div class="takeaway-body"><span class="takeaway-strong">{{step_1_title}}：</span>{{step_1_desc}}</div>
      </div>
      <div class="takeaway-card">
        <div class="step-num">2</div>
        <div class="takeaway-body"><span class="takeaway-strong">{{step_2_title}}：</span>{{step_2_desc}}</div>
      </div>
      <div class="takeaway-card">
        <div class="step-num">3</div>
        <div class="takeaway-body"><span class="takeaway-strong">{{step_3_title}}：</span>{{step_3_desc}}</div>
      </div>
    </div>
  </div>

  <div class="subtitle-safe-area">
    <span class="subtitle-placeholder-tip">[底部 15% 字幕保留区 · 压制时在此渲染双行字幕]</span>
  </div>
</body>
</html>
