<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>DailyPaper - 封面/导读</title>
  <link rel="stylesheet" href="themes/academic.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--page-bg);
      background-image: 
        radial-gradient(circle at 15% 20%, color-mix(in srgb, var(--accent-deep) calc(18% * var(--glow)), transparent) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, color-mix(in srgb, var(--positive) calc(12% * var(--glow)), transparent) 0%, transparent 45%),
        linear-gradient(color-mix(in srgb, var(--ink) calc(3% * var(--grid)), transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--ink) calc(3% * var(--grid)), transparent) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
      font-family: var(--font-body);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* 顶栏 (高 90px) */
    .top-bar {
      height: 90px;
      padding: 0 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      background: var(--logo-bg);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 22px;
      color: var(--on-accent);
      box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) calc(40% * var(--glow)), transparent);
    }
    .brand-name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(to right, var(--text-strong), color-mix(in srgb, var(--text-muted) calc(100% * var(--text-gradient)), var(--text-strong)));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: var(--font-heading);
    }
    .meta-tags {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .tag {
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 600;
    }
    .tag-category {
      background: color-mix(in srgb, var(--accent) 20%, var(--tint-base));
      border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--tint-base));
      color: var(--accent-text);
    }
    .tag-status {
      background: color-mix(in srgb, var(--positive) 20%, var(--tint-base));
      border: 1px solid color-mix(in srgb, var(--positive) 50%, var(--tint-base));
      color: var(--positive-text);
    }

    /* 核心导读区 (高 828px) */
    .main-content {
      height: 828px;
      padding: 50px 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .badge-bar {
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .source-badge {
      font-size: 18px;
      color: var(--info);
      background: color-mix(in srgb, var(--info) 12%, var(--tint-base));
      border: 1px solid color-mix(in srgb, var(--info) 30%, var(--tint-base));
      padding: 6px 16px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-weight: 600;
    }
    .title-cn {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.25;
      color: var(--text-strong);
      margin-bottom: 22px;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 20px color-mix(in srgb, var(--shadow-color) calc(60% * var(--text-shadow-strength)), transparent);
      max-width: 1520px;
      font-family: var(--font-heading);
    }
    .title-en {
      font-size: 26px;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 40px;
      max-width: 1400px;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      row-gap: 16px;
      column-gap: 24px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px 40px;
      max-width: 1300px;
      backdrop-filter: blur(12px);
    }
    .meta-label {
      font-size: 20px;
      color: var(--text-faint);
      font-weight: 600;
    }
    .meta-value {
      font-size: 20px;
      color: var(--text-title);
      font-weight: 500;
    }
    .authors-highlight {
      color: var(--info);
      font-weight: 600;
    }

    /* 底部 15% 字幕安全保留区 (高 162px) */
    .subtitle-safe-area {
      height: 162px;
      width: 100%;
      border-top: 1px dashed color-mix(in srgb, var(--ink) 12%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--subtitle-band);
    }
    .subtitle-placeholder-tip {
      font-size: 14px;
      color: color-mix(in srgb, var(--ink) 25%, transparent);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <div class="brand-logo">DP</div>
      <div class="brand-name">DailyPaper · 每日论文</div>
    </div>
    <div class="meta-tags">
      <div class="tag tag-category">{{field_tag}}</div>
      <div class="tag tag-status">{{paper_status}}</div>
    </div>
  </div>

  <div class="main-content">
    <div class="badge-bar">
      <span class="source-badge">arXiv: {{arxiv_id}}</span>
      <span class="source-badge">{{conference_or_journal}}</span>
    </div>
    <h1 class="title-cn">{{video_title}}</h1>
    <h2 class="title-en">{{paper_original_title}}</h2>
    <div class="meta-grid">
      <div class="meta-label">论文作者</div>
      <div class="meta-value"><span class="authors-highlight">{{authors_team}}</span><span class="affiliations"> ({{affiliations}})</span></div>
      <div class="meta-label">核心突破</div>
      <div class="meta-value">{{core_highlight}}</div>
    </div>
  </div>

  <div class="subtitle-safe-area">
    <span class="subtitle-placeholder-tip">[底部 15% 字幕保留区 · 压制时在此渲染双行字幕]</span>
  </div>
</body>
</html>
