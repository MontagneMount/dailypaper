<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>DailyPaper - 左侧论文原图 + 右侧要点</title>
  <link rel="stylesheet" href="themes/academic.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--page-bg);
      background-image: 
        radial-gradient(circle at 10% 10%, color-mix(in srgb, var(--accent-deep) calc(12% * var(--glow)), transparent) 0%, transparent 40%),
        linear-gradient(color-mix(in srgb, var(--ink) calc(2.5% * var(--grid)), transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--ink) calc(2.5% * var(--grid)), transparent) 1px, transparent 1px);
      background-size: 100% 100%, 48px 48px, 48px 48px;
      font-family: var(--font-body);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* 顶栏 (高 80px) */
    .header-bar {
      height: 80px;
      padding: 0 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .step-pill {
      background: var(--accent-deep);
      color: var(--on-accent);
      font-size: 16px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
    }
    .section-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-title);
      font-family: var(--font-heading);
    }
    .page-index {
      font-size: 18px;
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-weight: 600;
    }

    /* 主内容区 (高 838px) */
    .main-area {
      height: 838px;
      padding: 40px 80px;
      display: grid;
      grid-template-columns: 1020px 1fr;
      column-gap: 50px;
      align-items: center;
    }

    /* 左侧：原图展示容器 */
    .figure-container {
      height: 740px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 40px color-mix(in srgb, var(--shadow-color) calc(40% * var(--shadow-strength)), transparent);
    }
    .figure-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
    }
    .figure-tag {
      font-size: 15px;
      font-weight: 700;
      color: var(--info);
      background: color-mix(in srgb, var(--info) 12%, var(--tint-base));
      border: 1px solid color-mix(in srgb, var(--info) 30%, var(--tint-base));
      padding: 4px 12px;
      border-radius: 6px;
    }
    .source-hint {
      font-size: 14px;
      color: var(--text-muted);
    }
    .image-wrapper {
      flex: 1;
      width: 100%;
      background: var(--figure-bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--figure-frame);
    }
    .image-wrapper img {
      max-width: 96%;
      max-height: 96%;
      object-fit: contain;
    }
    .figure-caption {
      margin-top: 14px;
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.4;
      text-align: center;
    }

    /* 右侧：文案与核心要点 */
    .text-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .main-heading {
      font-size: 42px;
      font-weight: 900;
      color: var(--text-strong);
      line-height: 1.25;
      margin-bottom: 34px;
      letter-spacing: -0.5px;
      font-family: var(--font-heading);
    }
    .points-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .point-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-left: 6px solid var(--accent);
      border-radius: 14px;
      padding: 20px 24px;
      backdrop-filter: blur(8px);
    }
    .point-card:nth-child(2) { border-left-color: var(--accent-2); }
    .point-card:nth-child(3) { border-left-color: var(--positive); }
    .point-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .point-desc {
      font-size: 18px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* 底部 15% 字幕安全保留区 (高 162px) */
    .subtitle-safe-area {
      height: 162px;
      width: 100%;
      border-top: 1px dashed color-mix(in srgb, var(--ink) 12%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--subtitle-band);
    }
    .subtitle-placeholder-tip {
      font-size: 14px;
      color: color-mix(in srgb, var(--ink) 25%, transparent);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="header-left">
      <span class="step-pill">{{module_step}}</span>
      <h2 class="section-title">{{page_topic}}</h2>
    </div>
    <div class="page-index">{{page_number}} / {{total_pages}}</div>
  </div>

  <div class="main-area">
    <div class="figure-container">
      <div class="figure-header">
        <span class="figure-tag">论文原图 · {{figure_label}}</span>
        <span class="source-hint">出自原论文 {{figure_source_location}}</span>
      </div>
      <div class="image-wrapper">
        <img src="{{figure_image_path}}" alt="论文原图">
      </div>
      <div class="figure-caption">{{figure_caption}}</div>
    </div>

    <div class="text-container">
      <h1 class="main-heading">{{heading_title}}</h1>
      <div class="points-list">
        <div class="point-card">
          <div class="point-title">{{point_1_title}}</div>
          <div class="point-desc">{{point_1_desc}}</div>
        </div>
        <div class="point-card">
          <div class="point-title">{{point_2_title}}</div>
          <div class="point-desc">{{point_2_desc}}</div>
        </div>
        <div class="point-card">
          <div class="point-title">{{point_3_title}}</div>
          <div class="point-desc">{{point_3_desc}}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="subtitle-safe-area">
    <span class="subtitle-placeholder-tip">[底部 15% 字幕保留区 · 压制时在此渲染双行字幕]</span>
  </div>
</body>
</html>
